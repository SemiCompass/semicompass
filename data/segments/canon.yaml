segments:
- name: プリンティング
  classification: excluded
  rationale:
    source: S1
    pages: 事業の内容
  note: デジタル連帳プリンター、大判プリンターなどが中心で、半導体には関わらない。
- name: メディカル
  classification: excluded
  rationale:
    source: S1
    pages: 事業の内容
  note: CT装置、超音波診断装置、X線診断装置、MRI装置などが中心で、半導体には関わらない。
- name: イメージング
  classification: excluded
  rationale:
    source: S1
    pages: 事業の内容
  note: レンズ交換式デジタルカメラ、交換レンズなどが中心で、半導体には関わらない。
- name: インダストリアル
  classification: partial
  rationale:
    source: S1
    pages: 事業の内容
  note: 半導体露光装置、ダイボンダーを含む。FPD露光装置や有機ELディスプレイ製造装置も同じセグメントにある。
- name: その他及び全社
  classification: excluded
  rationale:
    source: S1
    pages: 事業の内容
  note: ハンディターミナル、ドキュメントスキャナーが主な製品で、半導体の記載はない。
