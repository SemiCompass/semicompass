# 主要メニューと、フッターのリンクの項目と順番（要件定義書 3.2、FR-515）。
# テーマは、5件を公開した時点で「ニュース」の次に足した（仕様書 9.9）。第2段階で、「ニュース」の次に「論考」を入れられる。URLは、要件定義書 3.1。
schema_version: 1
main:
  - label: 企業
    path: /companies/
  - label: 工程
    path: /processes/
  - label: ニュース
    path: /news/
  - label: テーマ
    path: /themes/
  - label: 学ぶ
    path: /learn/
# 運営者のnoteへのリンク（要件定義書 FR-708）。フッターの全ページと、トップページに置く。URLは、ここに1か所だけ書く。
note:
  label: SemiCompass｜note
  url: https://note.com/hysd_research
# フッターは、「ご利用にあたって」を下段に、それ以外のまとまりを上段に、この順で縦に並べる（仕様書 8.13）。
# 運営者のnoteへのリンクは、「お問い合わせ」のまとまりの最後に置く。
footer:
  - title: 探す
    links:
      - { label: 企業一覧, path: /companies/ }
      - { label: 工程の一覧, path: /processes/ }
      - { label: 用語集, path: /glossary/ }
      - { label: ニュース解説, path: /news/ }
  - title: このサイトについて
    links:
      - { label: このサイトについて, path: /about/ }
      - { label: 編集方針, path: /editorial-policy/ }
      - { label: 運営方針, path: /policy/ }
      - { label: 公開範囲と今後の予定, path: /about/roadmap/ }
  - title: ご利用にあたって
    links:
      - { label: 免責事項, path: /disclaimer/ }
      - { label: プライバシーポリシー, path: /privacy/ }
      - { label: 外部送信について, path: /external-transmission/ }
  - title: お問い合わせ
    links:
      - { label: よくある質問, path: /faq/ }
      - { label: 訂正一覧, path: /corrections/ }
      - { label: お問い合わせ, path: /contact/ }
