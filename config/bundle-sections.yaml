# 原資料束（scripts/bundle/make_bundle.py）で、有価証券報告書から取り出す節の既定。
#
# 節ごとに、key（節の名前。英小文字と _ だけ。重複しない）と、candidates（候補の要素ID。優先順）を持つ。
# make_bundle.py は、候補を上から順に探し、書類に最初に見つかった要素IDの行を使う。
# どの候補も書類にない節があるときは、その節の key を示して止まり、何も保存しない。
# セグメント情報の要素IDは、会計基準で違う（日本基準とIFRS）ため、候補を2つ持つ。
#
# 要素IDは、edinet-inspect-sections（scripts/bundle/inspect_sections.py）で確かめたものを書く
# （確認済み：東京エレクトロン S100YEOO（日本基準）、ソニー S100YE2C（IFRS））。
sections:
  - key: business_description      # 事業の内容
    candidates:
      - jpcrp_cor:DescriptionOfBusinessTextBlock
  - key: affiliated_entities       # 関係会社の状況
    candidates:
      - jpcrp_cor:OverviewOfAffiliatedEntitiesTextBlock
  - key: segment_information       # セグメント情報
    candidates:
      - jpcrp_cor:NotesSegmentInformationEtcConsolidatedFinancialStatementsTextBlock   # 日本基準
      - jpigp_cor:NotesSegmentInformationConsolidatedFinancialStatementsIFRSTextBlock  # IFRS
