# config/textbook-sources.yaml
# 書籍で確認する用語（basis: textbook）の、確認に使う入門書の一覧。運営者が書く。
# AI（AG-14）は、この書籍を読めない。ここに書くのは、運営者が手元の本と見比べるための、出典の情報である。
# ページ番号は、用語ごとに、運営者が確認のときに用語のファイルの sources[].pages に書く。
#
# 1冊ごとに次を書く（奥付に載っている）：
#   id: B1、B2…（重複しない）
#   title: 書名
#   author: 著者（複数のときは「、」で区切る）
#   publisher: 出版社
#   edition: 版・刷（例：第2版、2021年）
#   isbn: ISBN（ハイフンなし。奥付にあるとき）
schema_version: 1

books: []
