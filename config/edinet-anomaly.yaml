# J01の異常値の検知の基準（要件定義書 7.9）。MVPの実績で見直す。
# 1つでも当てはまれば、自動の取り込みをせずに、運営者に知らせる（変更案の題に【異常あり】を付ける）。
schema_version: 1
sales_change_ratio: 0.5        # 売上高が前年同期比で±50%を超える
unit_ratio_low: 700            # 前の期と比べて、この倍率〜
unit_ratio_high: 1400          # この倍率（またはその逆数）の差がある（1,000倍前後）
segment_sales_gap_ratio: 0.05  # セグメントの外部売上の合計と全社の売上の差が、5%を超える
