# XBRLの要素と表示項目の対応（データ定義書 7.8、schemas/config/xbrl-map.schema.json）
#
# 【確認の状況】確認済み（東京エレクトロン、SUMCO、ソニー、レゾナック、富士電機、京セラ、アドバンテスト、キヤノンの
# 実際の書類8件、2026年10月）の要素は、各項目のコメントに「確認済み」と、確認した会社を書く。
# 「未確認」と書いた要素は、実際の書類で確かめていない。未確認。段階2で実際の書類で確かめる。
# 確かめるまで、未確認の要素で取り込んだ値を公開に使わない。
# 【未確認のまま残すもの】日本基準の jppfs_cor:OperatingRevenue1（売上の代わりとしての使い方）、
# 半期報告書での米国基準、日本基準の半期のセグメント。
#
# 【段階3（取り込み）で使う規則】
# ・CSV は UTF-16LE（BOMあり）。取り込みの対象は、書類の中の jpcrp030000-asr（有価証券報告書）と
#   jpcrp040300-ssr（半期報告書）のファイル。jpaud のファイル（監査報告書）は使わない。
# ・当期のコンテキスト：有価証券報告書は CurrentYearDuration（期間）と CurrentYearInstant（時点）、
#   半期報告書は InterimDuration と InterimInstant。比較の前期は Prior1YearDuration、Prior1InterimDuration など。
# ・会計基準、連結の有無、期間は、DEI（下の dei）から読む。連結の判定は、DEIの連結財務諸表の作成の有無と、
#   コンテキストで行う（_NonConsolidatedMember を含まない行が連結）。CSV の「連結・個別」の列は使わない
#   （IFRS の連結の行は「その他」になる）。
# ・fiscal_period_end は、DEIの fiscal_year_end の年月（有価証券報告書も半期報告書も、その期を含む決算期の期末。
#   データ定義書 2.4.3）。period_type は、DEIの period_type（FY → annual、HY → half）。
#   period_start は、DEIの fiscal_year_start。period_end は、DEIの period_end（半期は、その半期の末日）。
# ・従業員は、コンテキストIDが CurrentYearInstant（連結）、CurrentYearInstant_NonConsolidatedMember（単体）に
#   完全に一致する行だけを使う。セグメント別の従業員数の行（Member を含むコンテキスト）は使わない。
# ・セグメントの一覧から除く、または別に扱うメンバー：
#   TotalOfReportableSegmentsAndOthersMember（合計。セグメントではない）、
#   ReportableSegmentsMember（IFRSの、報告セグメントの合計。セグメントではない。ソニーの書類にある）、
#   ReconcilingItemsMember（調整額。segment_adjustment に使う）、
#   NonConsolidatedMember（単体の文脈。セグメントではない）。
#   メンバー名は、前置きを除いた名前の完全一致で判定する（OtherReportableSegmentsMember のように、名前の一部が
#   似ているだけの別のメンバーは、セグメントとして残す）。
# ・セグメントの要素（外部売上、売上合計、利益）は、候補を先頭から順に探し、メンバー付きの行が1つでもある
#   最初の候補だけを、その書類で使う（候補どうしの行を混ぜない）。
# ・セグメントの member は、コンテキストIDの、期間（Duration など）の後（最初の _ の後）の部分から、会社固有の前置き
#   （jpcrp030000-asr_E01740-000 のような形）を除いた名前。数値の行に日本語のセグメント名はないため、自動取得の
#   データの name には、この名前（前置きを除いたメンバー名）を入れる。画面の日本語の名前は、セグメント対応表
#   （data/segments/）から表示する。
# ・DEIの期間の種類 "Q2" は、書類の種類のコード（docTypeCode）が 160（半期報告書）のときだけ、half として扱う
#   （2024〜2025年の半期報告書で確認）。160 以外で "Q2" が出たときは、未知の値として異常にする
#   （dei_unknown_period_type）。この条件は extract.py が持つ（スキーマは変えないため、ここには書けない）。
# ・使うコンテキストは、DEIの期間の種類で決める。どれも、コンテキストIDの完全一致で探す
#   （Member 付きのセグメントは、「当期の期間_」で始まるもの）。
#     FY（有価証券報告書）  CurrentYearDuration／CurrentYearInstant、前期は Prior1YearDuration／Prior1YearInstant
#     HY（半期報告書）      InterimDuration／InterimInstant、前期は Prior1InterimDuration／Prior1InterimInstant
#     Q2（旧様式の半期報告書。docTypeCode が 160 のときだけ）
#                           CurrentYTDDuration／CurrentQuarterInstant、前期は Prior1YTDDuration／Prior1QuarterInstant
#   Q2 の書類のセグメントは、CurrentYTDDuration_{前置き}{メンバー名}、Prior1YTDDuration_{前置き}{メンバー名}。
#   要素名は通常の書類と同じ。従業員の行はない（employees の行は作らない）。period_type は half、
#   fiscal_period_end は DEI の fiscal_year_end の年月。確認済み：S100UPNV（東京エレクトロン、Japan GAAP）、
#   S100URKY（ソニー、IFRS）、S100UQ07（アドバンテスト、IFRS）。いずれも期間 2024-04-01〜2024-09-30、
#   DEI の fiscal_year_end が 2025-03-31。
# ・先頭が「*:」の候補（例：*:SalesAndFinancialServicesRevenueIFRS）は、会社固有の前置きを無視し、要素IDの
#   「:」より後の名前（ローカル名）が一致するものに当てはまる。当てはまるのは、前置きが
#   jpcrp（数字）-（asr または ssr）_E（5桁の数字）-（3桁の数字）の形で、その E コードが、その書類の企業の
#   EDINETコード（DEIの jpdei_cor:EDINETCodeDEI の値）と一致するときだけ。他社の前置きの要素、共通の名前空間
#   （jpigp_cor、jppfs_cor など）の要素には当てはめない。確認済み：ソニーの2024年3月期の書類（S100TS7P）。
#   前期の列にも、同じ規則を使う。
# ・地域別の売上は、8つの書類のどれにも数値の項目がなかった。regions は空にする。
# ・米国基準（キヤノン）は、売上と純利益だけ。営業利益は null、segments は [] にする。
#
# 要素名は `接頭辞:名前` の形で、優先の順に並べる。接頭辞の意味:
#   jppfs_cor  日本基準の財務諸表   jpigp_cor  IFRSの財務諸表   jpcrp_cor  有価証券報告書・半期報告書の本文の項目
#   jpdei_cor  書類の基本情報（DEI）
schema_version: 1

# 書類の種類のコード → doc_type（データ定義書 5.3）。コードは文字列で書く
doc_types:
  "120": annual_report            # 有価証券報告書
  "130": amended_annual_report    # 訂正有価証券報告書
  "160": semiannual_report        # 半期報告書
  "170": amended_semiannual_report  # 訂正半期報告書

standards:
  # 日本基準：確認済み（東京エレクトロン、SUMCO、富士電機）。ただし次を除く。
  #   jppfs_cor:OperatingRevenue1 は、存在だけ確認。売上の代わりとしての使い方は未確認（末尾に置く）
  #   半期報告書のセグメント：未確認
  #   地域別の売上：項目なし（8つの書類のどれにも数値の項目がなかった）
  jgaap:
    items:
      net_sales:
        - jppfs_cor:NetSales                          # 確認済み（東京エレクトロン、SUMCO、富士電機）
        - jpcrp_cor:NetSalesSummaryOfBusinessResults  # 確認済み（東京エレクトロン、SUMCO、富士電機）
        - jppfs_cor:OperatingRevenue1                 # 未確認（存在だけ確認。売上の代わりとしての使い方は未確認）
      operating_income:
        - jppfs_cor:OperatingIncome                   # 確認済み（東京エレクトロン、SUMCO、富士電機）
      ordinary_income:
        - jppfs_cor:OrdinaryIncome                    # 確認済み（東京エレクトロン、SUMCO、富士電機）
        - jpcrp_cor:OrdinaryIncomeLossSummaryOfBusinessResults  # 確認済み（東京エレクトロン、SUMCO、富士電機）
      net_income:
        - jppfs_cor:ProfitLossAttributableToOwnersOfParent      # 確認済み（東京エレクトロン、SUMCO、富士電機）
        - jpcrp_cor:ProfitLossAttributableToOwnersOfParentSummaryOfBusinessResults  # 確認済み（東京エレクトロン、SUMCO、富士電機）
      segment_external_sales:
        - jpcrp_cor:RevenuesFromExternalCustomers     # 確認済み（富士電機）。コンテキストにセグメントのメンバーを含む行
      segment_total_sales:
        - jppfs_cor:NetSales                          # 確認済み（富士電機）。コンテキストにセグメントのメンバーを含む行
      segment_profit:
        - jppfs_cor:OperatingIncome                   # 確認済み（富士電機）。コンテキストにセグメントのメンバーを含む行
    expected_absent: []
  # IFRS：確認済み（ソニー、レゾナック、京セラ、アドバンテスト）。会社により要素名が異なる
  ifrs:
    items:
      net_sales:
        - jpigp_cor:NetSalesIFRS                      # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
        - jpigp_cor:RevenueIFRS                       # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
        - jpcrp_cor:RevenueIFRSSummaryOfBusinessResults  # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
      operating_income:
        - jpigp_cor:OperatingProfitLossIFRS           # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
      net_income:
        - jpigp_cor:ProfitLossAttributableToOwnersOfParentIFRS  # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
        - jpcrp_cor:ProfitLossAttributableToOwnersOfParentIFRSSummaryOfBusinessResults  # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
      segment_external_sales:
        - jpigp_cor:SalesToExternalCustomersIFRS      # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
        - jpigp_cor:RevenueFromExternalCustomersIFRS  # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）
        - "*:SalesAndFinancialServicesRevenueToCustomersIFRS"  # 確認済み（ソニーの2024年3月期の書類）。会社固有の要素（先頭のコメントの「*:」の規則）
      segment_total_sales:
        - jpigp_cor:NetSalesIFRS                      # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）。メンバーを含む行
        - jpigp_cor:RevenueIFRS                       # 確認済み（ソニー、レゾナック、京セラ、アドバンテスト）。メンバーを含む行
        - "*:SalesAndFinancialServicesRevenueIFRS"    # 確認済み（ソニーの2024年3月期の書類）。メンバーを含む行。会社固有の要素（「*:」の規則）
      segment_profit:
        - jpigp_cor:SegmentProfitLossIFRS             # 確認済み（京セラ、アドバンテスト）
        - jpigp_cor:OperatingProfitLossIFRS           # 確認済み（ソニー）。メンバーを含む行（営業利益の要素で、セグメント別の利益も表す）
    expected_absent:
      - ordinary_income   # IFRSには経常利益がない（確認済み。ソニー、レゾナック、京セラ、アドバンテスト）
  # 米国基準：確認済み（キヤノン）。売上と純利益だけ。営業利益とセグメントの数値は、キヤノンの書類にない。
  # 半期報告書での米国基準：未確認
  usgaap:
    items:
      net_sales:
        - jpcrp_cor:RevenuesUSGAAPSummaryOfBusinessResults  # 確認済み（キヤノン）
      net_income:
        - jpcrp_cor:NetIncomeLossAttributableToOwnersOfParentUSGAAPSummaryOfBusinessResults  # 確認済み（キヤノン）
    expected_absent:
      - operating_income  # キヤノンの書類にない（確認済み）
      - ordinary_income   # 米国基準には経常利益がない（確認済み。キヤノン）

# 働く環境（有価証券報告書の「従業員の状況」。データ定義書 5.5）。有価証券報告書だけにある。
# 半期報告書には、従業員の項目がない。確認済み（東京エレクトロン、ソニー、キヤノン）
employees:
  employees_consolidated:
    - jpcrp_cor:NumberOfEmployees      # 確認済み。コンテキストIDは CurrentYearInstant に完全に一致する行（連結）
  employees_non_consolidated:
    - jpcrp_cor:NumberOfEmployees      # 確認済み。コンテキストIDは CurrentYearInstant_NonConsolidatedMember に完全に一致する行（単体）
  average_age:
    - jpcrp_cor:AverageAgeYearsInformationAboutReportingCompanyInformationAboutEmployees  # 確認済み
  average_length_of_service:
    - jpcrp_cor:AverageLengthOfServiceYearsInformationAboutReportingCompanyInformationAboutEmployees  # 確認済み
  average_annual_salary:
    - jpcrp_cor:AverageAnnualSalaryInformationAboutReportingCompanyInformationAboutEmployees  # 確認済み

# 書類の基本情報（DEI）。会計基準、連結の有無、期間を、ここから読む。確認済み（8件の実際の書類）
dei:
  elements:
    accounting_standard: jpdei_cor:AccountingStandardsDEI                                    # 値は、下の accounting_standards の左側
    consolidated: jpdei_cor:WhetherConsolidatedFinancialStatementsArePreparedDEI             # 連結財務諸表の作成の有無
    period_type: jpdei_cor:TypeOfCurrentPeriodDEI                                            # 値は、下の period_types の左側
    fiscal_year_start: jpdei_cor:CurrentFiscalYearStartDateDEI
    period_end: jpdei_cor:CurrentPeriodEndDateDEI                                            # 半期は、その半期の末日
    fiscal_year_end: jpdei_cor:CurrentFiscalYearEndDateDEI
  accounting_standards:   # DEIの会計基準の値 → standards のキー
    "Japan GAAP": jgaap
    "IFRS": ifrs
    "US GAAP": usgaap
  period_types:           # DEIの期間の種類の値 → period_type（データ定義書 2.4.3）
    "FY": annual
    "HY": half
    "Q2": half            # docTypeCode が 160（半期報告書）のときだけ有効（先頭のコメント）。確認済み（2024〜2025年の半期報告書）
