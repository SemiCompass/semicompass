# 半導体を学ぶの体系（データ定義書 6.8、運用ルール書 4.2）。二段で持つ。
# fields：基礎編。対象（デバイス、工程、用途）で分けた9分野と、各分野の単元の順番。
# physics：深掘り編「半導体の物理」。学問（物理、材料）で分けたカードと、各カードの単元の順番。学習の順は、基礎編と別に作る。
# "no" は引用符で囲む（YAML 1.1 では no が false と読まれるため）。
# units には、ページ（content/learn/{フォルダ}/{slug}.md、工程ページ、用語ページ）ができたものだけを書く。
# 学習のページが分野と別のフォルダにあるときは folder を書く（公開済みのURLを変えないため）。sections は分野の中の小分け。
schema_version: 1
fields:
  - "no": 1
    slug: basics
    title: 半導体の基礎
    summary: 半導体が電気を通したり止めたりできる仕組みと、トランジスタの働きを学びます。
    units:
      - { type: learn, ref: electricity-basics }
    sections:
      - slug: properties
        title: 半導体の性質
        units:
          - { type: learn, ref: what-is-semiconductor }
          - { type: learn, ref: electrons-and-holes }
          - { type: learn, ref: pn-junction }
          - { type: learn, ref: carrier-motion }
          - { type: learn, ref: energy-band }
      - slug: transistor
        title: トランジスタ
        units:
          - { type: learn, ref: mosfet, folder: devices }
          - { type: learn, ref: scaling, folder: devices }
  - "no": 2
    slug: materials
    title: 半導体材料とウェーハ
    summary: シリコンの結晶からウェーハができるまでと、シリコン以外の材料を学びます。
    units: []
    sections:
      - slug: crystal
        title: 結晶とウェーハ
        units:
          - { type: learn, ref: crystal, folder: silicon }
          - { type: learn, ref: wafer-types, folder: silicon }
          - { type: process, ref: wafer }
      - slug: materials
        title: 半導体の材料
        units:
          - { type: learn, ref: compound, folder: basics }
          - { type: learn, ref: epitaxial-growth }
          - { type: learn, ref: new-materials }
          - { type: learn, ref: process-materials }
          - { type: learn, ref: thin-film-materials }
  - "no": 3
    slug: design
    title: デバイス設計・回路
    summary: トランジスタを組み合わせて計算や記憶をする回路の仕組みと、設計の進め方を学びます。
    units: []
    sections:
      - slug: logic
        title: 論理回路
        units:
          - { type: learn, ref: cmos-inverter, folder: logic }
          - { type: learn, ref: gates-and-memory, folder: logic }
      - slug: devices
        title: ロジックとメモリ
        units:
          - { type: learn, ref: processor, folder: logic }
          - { type: learn, ref: memory, folder: devices }
      - slug: analog
        title: アナログ回路
        units:
          - { type: learn, ref: analog, folder: devices }
      - slug: flow
        title: 設計の進め方
        units:
          - { type: learn, ref: design-flow, folder: logic }
          - { type: learn, ref: low-power, folder: logic }
          - { type: learn, ref: clock-timing, folder: logic }
          - { type: learn, ref: design-rules, folder: logic }
          - { type: process, ref: circuit-design }
  - "no": 4
    slug: process
    title: 製造プロセスと装置
    summary: ウェーハに回路を作り、チップとして組み立てるまでの工程と装置を学びます。
    units: []
    sections:
      - slug: front-end
        title: 前工程
        units:
          - { type: process, ref: cleaning }
          - { type: learn, ref: cleaning-contamination }
          - { type: process, ref: deposition }
          - { type: learn, ref: deposition-methods }
          - { type: process, ref: lithography }
          - { type: learn, ref: resolution }
          - { type: process, ref: etching }
          - { type: learn, ref: plasma-process }
          - { type: learn, ref: doping-and-anneal }
          - { type: process, ref: cmp }
          - { type: learn, ref: planarization }
          - { type: learn, ref: interconnect }
      - slug: back-end
        title: 後工程
        units:
          - { type: process, ref: dicing }
          - { type: process, ref: packaging }
          - { type: learn, ref: advanced-packaging }
          - { type: process, ref: final-test }
  - "no": 5
    slug: test
    title: 検査と信頼性
    summary: できた半導体を確かめる方法と、長く使えるかを確かめる考え方を学びます。
    units:
      - { type: learn, ref: test-and-reliability }
      - { type: learn, ref: inspection }
      - { type: learn, ref: reliability-tests }
      - { type: learn, ref: failure-analysis }
      - { type: learn, ref: design-for-test }
      - { type: learn, ref: yield-management }
  - "no": 6
    slug: power
    title: パワー半導体
    summary: 電気自動車などで大きな電力を制御する半導体と、その材料を学びます。
    units:
      - { type: learn, ref: power, folder: devices }
      - { type: learn, ref: device-types }
      - { type: learn, ref: inverter }
      - { type: learn, ref: high-voltage }
      - { type: learn, ref: sic-gan }
      - { type: learn, ref: applications }
  - "no": 7
    slug: sensors
    title: センサー・計測
    summary: 光や圧力などを電気の信号に変える、センサーの仕組みを学びます。
    units:
      - { type: learn, ref: mems-sensor, folder: devices }
      - { type: learn, ref: image-sensor, folder: devices }
      - { type: learn, ref: optoelectronics, folder: devices }
      - { type: learn, ref: temperature-sensor, folder: sensors }
      - { type: learn, ref: magnetic-sensor, folder: sensors }
      - { type: learn, ref: sensor-accuracy, folder: sensors }
      - { type: learn, ref: sensor-signal-chain, folder: sensors }
      - { type: learn, ref: gas-sensor, folder: sensors }
      - { type: learn, ref: sensor-fusion, folder: sensors }
  - "no": 8
    slug: communication
    title: 通信・信号処理
    summary: 無線通信で高い周波数の信号を扱う半導体の仕組みを学びます。
    units:
      - { type: learn, ref: rf, folder: devices }
      - { type: learn, ref: high-speed-link, folder: communication }
      - { type: learn, ref: optical-communication, folder: communication }
      - { type: learn, ref: dsp, folder: communication }
      - { type: learn, ref: clock-generation, folder: communication }
      - { type: learn, ref: security-chip, folder: communication }
      - { type: learn, ref: protocol-layers, folder: communication }
  - "no": 9
    slug: industry
    title: 工場と業界
    summary: 工場を支える技術と、業界の役割分担、歴史、日本の位置を学びます。
    units: []
    sections:
      - slug: facilities
        title: 工場を支える技術
        units:
          - { type: learn, ref: clean-room, folder: facilities }
          - { type: learn, ref: water-and-gas, folder: facilities }
          - { type: learn, ref: automation, folder: facilities }
          - { type: learn, ref: energy-environment, folder: facilities }
          - { type: learn, ref: building-a-fab, folder: facilities }
      - slug: industry
        title: 業界の構造と企業
        units:
          - { type: learn, ref: roles }
          - { type: learn, ref: supply-chain-view }
          - { type: learn, ref: demand-cycle }
          - { type: learn, ref: history }
          - { type: learn, ref: policy }
          - { type: learn, ref: japan-position }
physics:
  title: 半導体の物理
  summary: 半導体が動く理由を、式の形から読み取ります。導出はしません。
  cards:
    - label: A
      slug: solid-state
      title: 固体物理学
      summary: 結晶の中で電子がどう振る舞い、熱でどう変わるかを、式から読み取ります。
      units:
        - { type: learn, ref: band-gap }
        - { type: learn, ref: intrinsic-carrier }
    - label: B
      slug: device-physics
      title: 半導体デバイス物理
      summary: pn接合やトランジスタが動く理由を、電位と電流の式から理解します。
      units:
        - { type: learn, ref: built-in-potential }
    - label: C
      slug: optics
      title: 光物性
      summary: 半導体が光を吸収し、光を出す仕組みを、式から読み取ります。
      units: []
    - label: D
      slug: materials-physics
      title: 結晶・材料の物理
      summary: 欠陥、熱処理、結晶成長の温度と時間の決まり方を、式から読み取ります。
      units: []
