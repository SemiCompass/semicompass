name: preview

# main にあるこの定義だけが動く。変更案のコードは実行せず、
# pr-check が保存したビルドの出力（静的なファイル）だけを受け取る
on:
  workflow_run:
    workflows: [pr-check]
    types: [completed]

permissions: {}

jobs:
  create:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # preview の Environment（CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）を使う。main だけに限定済み
    environment: preview
    permissions:
      contents: read
      actions: read
    concurrency:
      group: preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      # 変更案ではなく、main の設定（wrangler.jsonc、パッケージ）を使う
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 成果物を検査する（静的なファイルだけを受け取る）
        run: |
          test -z "$(find dist -type l)"
          test ! -e dist/_worker.js
          test "$(find dist -type f | wc -l)" -le 20000

      - name: プレビューを作る
        env:
          # 変更案の番号は、変更案が作る成果物ではなく、GitHubのイベントから取る
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview.ndjson
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "変更案の番号を取得できない"; exit 1;; esac
          npx wrangler preview --name "pr-${PR_NUMBER}"
          # プレビューのURLを、ログで確かめられるようにする
          cat "$WRANGLER_OUTPUT_FILE_PATH" || true
