name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# この確認には秘密の情報（Secrets）を一切渡さない
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Python の部品（PyYAML、jsonschema。版は scripts/requirements.txt で固定）。
      # ubuntu-24.04 では、システムの Python に直接入れられないため、仮想環境に入れる
      - name: Python の部品を入れる
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 単体テスト
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/deploy
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/edinet
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/validate

      - name: データの形式の検証
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/validate/validate_data.py'

      - run: npm run build:preview

      # 他の確認（文章、アクセシビリティなど）は、要件定義書10.2に沿って後で加える

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 7
          if-no-files-found: error
