name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# この確認には秘密の情報（Secrets）を一切渡さない
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # 保護する場所の変更の検査（アーキテクチャ設計書 10.3 の 2）。
      # 運営者以外（Bot、または claude/・draft/ で始まる作業ブランチ）が作った変更案で、
      # 次の場所が変わっていたら不合格にする。運営者が自分で作った変更案は対象外。
      - name: 保護する場所の変更の検査
        env:
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$AUTHOR_TYPE" in
            Bot) restricted=1 ;;
            *) case "$HEAD_REF" in claude/*|draft/*) restricted=1 ;; *) restricted=0 ;; esac ;;
          esac
          if [ "$restricted" != "1" ]; then
            echo "運営者の変更案のため、この検査の対象外"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          hits=$(printf '%s\n' "$changed" | grep -E '^(\.github/|schemas/|scripts/factcheck/|config/budgets\.yaml$|CLAUDE\.md$|CODEOWNERS$|\.github/CODEOWNERS$)' || true)
          if [ -n "$hits" ]; then
            echo "::error::運営者以外が作った変更案で、保護する場所が変わっている。運営者が自分で作る変更案で行うこと。"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "保護する場所の変更はない"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: CSSの検査
        run: npm run lint:css
        
      # Python の部品（PyYAML、jsonschema。版は scripts/requirements.txt で固定）。
      # ubuntu-24.04 では、システムの Python に直接入れられないため、仮想環境に入れる
      - name: Python の部品を入れる
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 単体テスト
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/deploy
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/edinet
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/validate
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/bundle
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/llm
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/textcheck
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/draft
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/design
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/explainer
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/news
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/pages
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests/factcheck

      - name: データの形式の検証
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/validate/validate_data.py'

      - run: npm run build:preview

      # 画面の幅の確認（要件定義書3.5、10.2）。代表のページを5つの幅（320〜1440px）で開き、横のはみ出しと、本文の1行の長さを確かめる。
      # ブラウザは、ubuntu-24.04 のランナーに入っている Chrome を使う（ブラウザを新しく取得しない）
      - name: 画面の幅の確認
        run: npm run check:layout

      # 他の確認（文章、アクセシビリティなど）は、要件定義書10.2に沿って後で加える

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 7
          if-no-files-found: error
