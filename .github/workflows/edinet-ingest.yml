name: edinet-ingest

# 手動で動かす。EDINETの書類一覧から1社分の書類を探し、data/auto/{slug}.json の形に組み立てる
# （結果は成果物（7日）に置くだけで、data/auto/ には書き込まない）
on:
  workflow_dispatch:
    inputs:
      company:
        description: 企業の slug（data/companies/{slug}.yaml）。1社だけ
        required: true
        type: string
      from:
        description: 日付の範囲の始め（YYYY-MM-DD）。toと一緒に指定する。空なら日本時間の前日だけ
        required: false
        type: string
      to:
        description: 日付の範囲の終わり（YYYY-MM-DD）
        required: false
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # edinet の Environment（EDINET_API_KEY）を使う。main だけに限定済み
    environment: edinet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 書類を探して組み立てる
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # 入力は、コマンドに直接埋め込まず、環境変数で受け取る
          INPUT_COMPANY: ${{ inputs.company }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          slug="$INPUT_COMPANY"
          if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "slug の形が正しくない"; exit 2
          fi
          mkdir -p "$RUNNER_TEMP/out"
          args=(--company "$slug")
          if [ -n "$INPUT_FROM" ] || [ -n "$INPUT_TO" ]; then
            args+=(--from "$INPUT_FROM" --to "$INPUT_TO")
          fi
          "$RUNNER_TEMP/venv/bin/python" scripts/edinet/list_filings.py "${args[@]}" \
            --out "$RUNNER_TEMP/out/filings.json"
          ing=(--company "$slug" --filings-json "$RUNNER_TEMP/out/filings.json" --out-dir "$RUNNER_TEMP/out")
          if [ -f "data/auto/${slug}.json" ]; then
            ing+=(--existing "data/auto/${slug}.json")
          fi
          "$RUNNER_TEMP/venv/bin/python" scripts/edinet/ingest_company.py "${ing[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ingest
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: ignore
