name: draft-companies

# 手動で動かす。複数の企業（最大10社）について、まとめて次の3つを行う。
#   1. bundle ：原資料束を作り、R2 の非公開バケットに保存する（edinet-bundle と同じ処理。refresh_bundle がオンのとき）
#   2. draft  ：AG-14（Claude API）で、事業概要とセグメント対応表の下書きを作る（draft-company と同じ処理）
#   3. publish：企業ごとに変更案を作り、AIの利用額を ops-log に追記する
# 1社が失敗しても、ほかの企業は続ける。失敗した企業だけ、あとで「Re-run failed jobs」か、1社用のワークフローで動かし直す。
# 原資料束の本文は、リポジトリ、ログ、要約、成果物、変更案に出さない。
on:
  workflow_dispatch:
    inputs:
      companies:
        description: 企業の slug を、カンマで区切る（最大10社）
        required: true
        type: string
      refresh_bundle:
        description: 先に原資料束を作り直す（初めての企業はオンにする）
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# draft-company と同じグループにして、同時に動かさない（利用額の記録の書き込みがぶつからないように）
concurrency:
  group: draft-company
  cancel-in-progress: false

jobs:
  # 0. 入力の企業の一覧を確かめる
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      companies: ${{ steps.list.outputs.companies }}
    steps:
      - name: 企業の一覧を確かめる
        id: list
        env:
          INPUT_COMPANIES: ${{ inputs.companies }}
        run: |
          IFS=',' read -ra raw <<< "$INPUT_COMPANIES"
          slugs=()
          for s in "${raw[@]}"; do
            s="$(echo "$s" | xargs)"
            [ -z "$s" ] && continue
            if ! [[ "$s" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then echo "slug の形が正しくない"; exit 2; fi
            slugs+=("$s")
          done
          if [ "${#slugs[@]}" -eq 0 ]; then echo "企業がない"; exit 2; fi
          if [ "${#slugs[@]}" -gt 10 ]; then echo "企業の数が多すぎる（最大10社）"; exit 2; fi
          json="$(printf '%s\n' "${slugs[@]}" | sort -u | jq -R . | jq -sc .)"
          echo "companies=$json" >> "$GITHUB_OUTPUT"
          echo "対象: $json"

  # 1. 原資料束を作る（bundle-write の Environment。EDINET_API_KEY、R2 の書き込み用トークン）
  bundle:
    needs: prepare
    if: ${{ inputs.refresh_bundle }}
    runs-on: ubuntu-24.04
    environment: bundle-write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        company: ${{ fromJSON(needs.prepare.outputs.companies) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 原資料束を作る（本文は出さない）
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SLUG: ${{ matrix.company }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/bundle/make_bundle.py \
            --company "$SLUG" --summary "$GITHUB_STEP_SUMMARY"

  # 2. 下書きを作る（draft の Environment。R2 の読み取り用トークン、Claude API の ID連携）。
  #    リポジトリには書き込めない。1社ずつ順に動かす
  draft:
    needs: [prepare, bundle]
    # 原資料束を作り直さないとき（bundle が skipped）も動かす。bundle の一部の企業が失敗しても、ほかの企業は動かす
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: draft
    permissions:
      contents: read
      id-token: write   # Claude API の ID連携（Workload Identity Federation）に使う
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        company: ${{ fromJSON(needs.prepare.outputs.companies) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      # 今月のAIの利用額を、ops-log ブランチの ops/ledger/ から読む（予算の確認に使う）。
      # 注意：同じ実行の、前の企業の利用額は、publish で追記するまで ops-log に入らない（1社あたり十数円）
      - name: 運営記録（利用額）を読む
        run: |
          git clone --quiet --depth 1 --branch ops-log \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/ops-log" \
            || echo "ops-log ブランチがまだない"

      - name: GitHub の ID トークンを取る（Claude API の ID連携）
        run: |
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          test -s "$RUNNER_TEMP/gha-jwt"

      - name: 下書きを作る（原資料束の本文は出さない）
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
          SLUG: ${{ matrix.company }}
        run: |
          out="$RUNNER_TEMP/draft-out"
          set +e
          "$RUNNER_TEMP/venv/bin/python" scripts/draft/draft_company.py \
            --company "$SLUG" \
            --out-dir "$out" \
            --ledger-dir "$RUNNER_TEMP/ops-log/ops/ledger" \
            --run-id "$GITHUB_RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/gha-jwt"
          # 0：下書きを作った。3：休止中か予算の上限で、呼ばずに終えた（利用額の記録だけ残す）
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      # 成果物：下書き（公開の変更案になるもの）、利用額の記録、変更案の説明だけ。失敗しても、利用額の記録を残すために上げる
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: draft-out-${{ matrix.company }}
          path: ${{ runner.temp }}/draft-out
          retention-days: 3
          if-no-files-found: ignore

  # 3. 企業ごとに変更案を作り、利用額を ops-log に追記する。秘密は渡さない（GITHUB_TOKEN だけ）。1社ずつ順に動かす
  publish:
    needs: [prepare, draft]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        company: ${{ fromJSON(needs.prepare.outputs.companies) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true   # 下書きのジョブが途中で止まり、成果物がないとき
        with:
          name: draft-out-${{ matrix.company }}
          path: ${{ runner.temp }}/draft-out

      - name: 下書きがあるか確かめる
        id: check
        env:
          SLUG: ${{ matrix.company }}
        run: |
          out="$RUNNER_TEMP/draft-out"
          if [ -f "$out/content/companies/$SLUG.md" ] && [ -f "$out/data/segments/$SLUG.yaml" ] && [ -f "$out/pr-body.md" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "下書きがない（$SLUG）。変更案は作らない"
          fi

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        if: steps.check.outputs.created == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 下書きを置いて、形式を検証する
        if: steps.check.outputs.created == 'true'
        env:
          SLUG: ${{ matrix.company }}
        run: |
          out="$RUNNER_TEMP/draft-out"
          mkdir -p content/companies data/segments
          cp "$out/content/companies/$SLUG.md" "content/companies/$SLUG.md"
          cp "$out/data/segments/$SLUG.yaml" "data/segments/$SLUG.yaml"
          "$RUNNER_TEMP/venv/bin/python" scripts/validate/validate_data.py

      - name: 変更案を作る
        if: steps.check.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.company }}
        run: |
          branch="draft/company-${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "content/companies/$SLUG.md" "data/segments/$SLUG.yaml"
          git commit -m "下書き：${SLUG} の事業概要とセグメント対応表（AG-14、実行 ${GITHUB_RUN_ID}）"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "下書き：${SLUG} の事業概要とセグメント対応表" \
            --body-file "$RUNNER_TEMP/draft-out/pr-body.md"

      # 利用額の記録（データ定義書 10.3）。JSON Lines は追記だけ。ブランチがなければ作る
      - name: 利用額を ops-log に追記する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/draft-out/ledger"
          if ! ls "$src"/*.jsonl >/dev/null 2>&1; then
            echo "利用額の記録がない"; exit 0
          fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/ops-log"
          if git ls-remote --exit-code --heads "$url" ops-log >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ops-log "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan ops-log
            git -C "$dir" remote add origin "$url"
          fi
          mkdir -p "$dir/ops/ledger"
          for f in "$src"/*.jsonl; do
            name="$(basename "$f")"
            if ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}\.jsonl$ ]]; then echo "記録のファイル名が正しくない"; exit 1; fi
            cat "$f" >> "$dir/ops/ledger/$name"
          done
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add ops/ledger
          git -C "$dir" commit --quiet -m "利用額の記録（draft-companies、実行 ${GITHUB_RUN_ID}）"
          git -C "$dir" push --quiet origin ops-log
