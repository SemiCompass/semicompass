name: measure-ag23

# 手動で動かす。AG-23（別のモデルによる確認）の効果を、実際の Claude API で測る（運営者が行う。要求定義書 AG-23 の (a)）。
# tests/explainer/ag23_samples.py の見本（わざと誤りを入れた解説6件、誤りのない解説3件）を、AG-23 に確認させ、
# 誤りの検出率と、誤検知の割合を出す。下書きを作る AG-14 は呼ばない。見本の本文は、ログにも成果物にも出さない
# （出るのは、見本の番号、誤りの種類、判定だけ）。AIの利用額は、AG-23 の予算（config/budgets.yaml）の中で行う。
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: 同じ見本を繰り返す回数（1〜3。多いほど安定するが、費用が増える）
        required: true
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: draft-company
  cancel-in-progress: false

jobs:
  # 1. 測る。秘密（Claude APIのID連携）は、このジョブだけに渡す。このジョブは、リポジトリに書き込めない
  measure:
    runs-on: ubuntu-24.04
    environment: draft
    permissions:
      contents: read
      id-token: write   # Claude API の ID連携（Workload Identity Federation）に使う
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 運営記録（利用額）を読む
        run: |
          git clone --quiet --depth 1 --branch ops-log \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/ops-log" \
            || echo "ops-log ブランチがまだない"

      - name: GitHub の ID トークンを取る（Claude API の ID連携）
        run: |
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          test -s "$RUNNER_TEMP/gha-jwt"

      - name: AG-23 の効果を測る（見本の本文は出さない）
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
          INPUT_REPEAT: ${{ inputs.repeat }}
        run: |
          if ! [[ "$INPUT_REPEAT" =~ ^[1-3]$ ]]; then
            echo "repeat は 1〜3"; exit 2
          fi
          out="$RUNNER_TEMP/draft-out"
          set +e
          "$RUNNER_TEMP/venv/bin/python" scripts/draft/measure_ag23.py \
            --out-dir "$out" \
            --ledger-dir "$RUNNER_TEMP/ops-log/ops/ledger" \
            --run-id "$GITHUB_RUN_ID" \
            --repeat "$INPUT_REPEAT" \
            --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/gha-jwt"
          # 0：測った。3：休止中か予算の上限で、測れなかった見本がある（測れた分と、利用額の記録は残る）
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi

      # 成果物に入れるのは、測定の結果（ag23-measurement.md）と、利用額の記録だけ。失敗したときも、利用額の記録を残すために上げる
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: draft-out
          path: ${{ runner.temp }}/draft-out
          retention-days: 14
          if-no-files-found: ignore

  # 2. 利用額を ops-log に追記する。秘密は渡さない（GITHUB_TOKEN だけ）
  publish:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: draft-out
          path: ${{ runner.temp }}/draft-out

      - name: 利用額を ops-log に追記する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/draft-out/ledger"
          if ! ls "$src"/*.jsonl >/dev/null 2>&1; then
            echo "利用額の記録がない"; exit 0
          fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/ops-log"
          if git ls-remote --exit-code --heads "$url" ops-log >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ops-log "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan ops-log
            git -C "$dir" remote add origin "$url"
          fi
          mkdir -p "$dir/ops/ledger"
          for f in "$src"/*.jsonl; do
            name="$(basename "$f")"
            if ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}\.jsonl$ ]]; then echo "記録のファイル名が正しくない"; exit 1; fi
            cat "$f" >> "$dir/ops/ledger/$name"
          done
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add ops/ledger
          git -C "$dir" commit --quiet -m "利用額の記録（measure-ag23、実行 ${GITHUB_RUN_ID}）"
          git -C "$dir" push --quiet origin ops-log
