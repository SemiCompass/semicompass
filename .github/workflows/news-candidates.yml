name: news-candidates

# J02：ニュース候補を集めて点を付け、Issue にする（運用ルール書 3.1〜3.3）。平日の6:00（日本時間）に動く。手動でも動かせる。
# 集める（AIは使わない）→ AG-10 で点を付ける（Claude API）→ 候補の一覧を Issue にする。
# 元記事の本文は集めない。Issue に出るのは、見出し・発信元・URL・公表日・点・理由だけ。
# 解説を書くのは、運営者が Issue のコメントに /draft を書いたとき（J03。別のワークフロー）。
on:
  schedule:
    - cron: "0 21 * * 0-4"   # 日曜〜木曜の21:00 UTC ＝ 月曜〜金曜の6:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-candidates
  cancel-in-progress: false

jobs:
  # 1. 集めて、点を付ける。秘密（Claude APIのID連携）は、このジョブだけに渡す。リポジトリには書き込めない
  score:
    runs-on: ubuntu-24.04
    environment: draft   # ANTHROPIC_*（main だけに限定済み）
    permissions:
      contents: read
      id-token: write
    outputs:
      has_candidates: ${{ steps.collect.outputs.has_candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      # 今月のAIの利用額と、これまでに候補にしたURLを、ops-log ブランチから読む。ブランチがなければ空
      - name: 運営記録を読む
        run: |
          git clone --quiet --depth 1 --branch ops-log \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/ops-log" \
            || echo "ops-log ブランチがまだない"

      - name: 候補を集める
        id: collect
        run: |
          out="$RUNNER_TEMP/news-out"
          mkdir -p "$out"
          seen_args=()
          if [ -f "$RUNNER_TEMP/ops-log/ops/news/seen.txt" ]; then seen_args=(--seen "$RUNNER_TEMP/ops-log/ops/news/seen.txt"); fi
          "$RUNNER_TEMP/venv/bin/python" scripts/news/collect.py --out "$out/candidates.json" "${seen_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          n="$("$RUNNER_TEMP/venv/bin/python" -c "import json,sys; print(len(json.load(open(sys.argv[1]))['candidates']))" "$out/candidates.json")"
          if [ "$n" != "0" ]; then echo "has_candidates=true" >> "$GITHUB_OUTPUT"; else echo "has_candidates=false" >> "$GITHUB_OUTPUT"; fi

      - name: GitHub の ID トークンを取る（Claude API の ID連携）
        if: steps.collect.outputs.has_candidates == 'true'
        run: |
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          test -s "$RUNNER_TEMP/gha-jwt"

      - name: 点を付ける（AG-10）
        if: steps.collect.outputs.has_candidates == 'true'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
        run: |
          out="$RUNNER_TEMP/news-out"
          set +e
          "$RUNNER_TEMP/venv/bin/python" scripts/news/score.py \
            --candidates "$out/candidates.json" \
            --out-dir "$out" \
            --ledger-dir "$RUNNER_TEMP/ops-log/ops/ledger" \
            --run-id "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          code="${PIPESTATUS[0]}"
          set -e
          rm -f "$RUNNER_TEMP/gha-jwt"
          # 0：点を付けた。3：休止中か予算の上限で呼ばなかった（利用額の記録だけ残す）。ほかは失敗
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      # 失敗したときも、利用額の記録を残すために上げる
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: news-out
          path: ${{ runner.temp }}/news-out
          retention-days: 3
          if-no-files-found: ignore

  # 2. Issue を作り、利用額と候補にしたURLを ops-log に追記する。秘密は渡さない（GITHUB_TOKEN だけ）
  publish:
    needs: score
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: news-out
          path: ${{ runner.temp }}/news-out

      - name: Issue を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/news-out/issue-body.md"
          if [ ! -s "$body" ]; then echo "Issue の本文がない（点付けが休止・失敗）"; exit 0; fi
          today="$(TZ=Asia/Tokyo date +%F)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ニュース候補 ${today}" \
            --body-file "$body" \
            --label "news-candidates" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "ニュース候補 ${today}" --body-file "$body"

      # 利用額の記録（データ定義書 10.3）と、候補にしたURL（次の日に重ねて出さないため）。どちらも追記だけ
      - name: 運営記録に追記する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/news-out"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/ops-log"
          if git ls-remote --exit-code --heads "$url" ops-log >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ops-log "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan ops-log
            git -C "$dir" remote add origin "$url"
          fi
          changed=false
          if ls "$out"/ledger/*.jsonl >/dev/null 2>&1; then
            mkdir -p "$dir/ops/ledger"
            for f in "$out"/ledger/*.jsonl; do
              name="$(basename "$f")"
              if ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}\.jsonl$ ]]; then echo "記録のファイル名が正しくない"; exit 1; fi
              cat "$f" >> "$dir/ops/ledger/$name"
            done
            changed=true
          fi
          if [ -s "$out/candidates.json" ]; then
            mkdir -p "$dir/ops/news"
            python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          for c in d['candidates']:
              print(c['url'], d['collected_on'])
          " "$out/candidates.json" >> "$dir/ops/news/seen.txt"
            changed=true
          fi
          if [ "$changed" = "false" ]; then echo "追記するものがない"; exit 0; fi
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add ops
          git -C "$dir" commit --quiet -m "ニュース候補の記録（news-candidates、実行 ${GITHUB_RUN_ID}）"
          git -C "$dir" push --quiet origin ops-log
