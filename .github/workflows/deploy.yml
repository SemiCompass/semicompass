name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# 古い公開が新しい公開を上書きしないよう、順番に動かす
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # production の Environment（CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）を使う。main だけに限定済み
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:production

      - name: 本番へ公開する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: npx wrangler deploy --message "${GITHUB_SHA}"

      - name: 公開の記録を作る
        run: |
          python3 scripts/deploy/record_deploy.py \
            --output-file "${{ runner.temp }}/wrangler-deploy.ndjson" \
            --commit "${GITHUB_SHA}" --trigger merge > deploy-record.json
          cat deploy-record.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-record
          path: deploy-record.json
          retention-days: 90
