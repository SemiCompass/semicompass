# config/explainer-sources.yaml(案)
# 承認:2026-10-07 運営者が、掲載のURLすべてを承認(補助 supplementary も含む。補助は定義の出典にしない)。各サイトの利用条件の確認は、取り込みの前に別途行う
# 工程・用語の下書き(AG-14)が取得してよい出典を、対象ごとに決める。
# 運営者が status を approved に直したURLだけを、原資料束に取り込む。AIの知識だけで書かせない(CLAUDE.md 6.4)。
#
# - status: candidate(候補) / approved(承認) / rejected(不採用)
# - role: primary(定義の出典にする) / supplementary(補助。定義の出典にはしない)
# - kind: 原資料束の manifest の kind(データ定義書8.2)に合わせる
# - slug は仮。用語のslugは英語の名前か略語から決める(データ定義書2.3)
# - SEAJ(seaj.or.jp)は、転載・営利利用の制限があるため、ここに入れない

# 2026-10-08 利用規約の確認（運営者の記録）。次のドメインは rejected にした：
#   semiconductor.samsung.com（個人のPCでの個人利用に限る）、www.samco.co.jp（私用を超える複製は承諾が必要）、
#   www.tok-pr.com と www.tok.co.jp（非営利かつ組織内の利用に限り複製可）、www.accretech.com（非商業・個人利用に限る。ネットワーク上への複製不可）、
#   www.lasertec.co.jp（非営利かつ私的・組織内の利用に限り複製可）、www.tim.toppan.com（URLがリンク切れ）。
#   書面の許可を得たときだけ、approved に戻す。
#   確認の結果、「法律が認める範囲を超える複製を禁止」とする条件つきのサイトは approved のまま残した（取得は非公開の保管場所への一時保存で、サイトには自分の言葉の解説と出典だけを載せる。法務確認（MV-05）で確かめる）。
#   basis: reviewed の用語・工程は、出典を取得しない。

