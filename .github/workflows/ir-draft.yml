name: ir-draft

# 手動で動かす。1社・1つの決算発表について、IR重要ポイントの下書きを作る（AG-12。要求定義書 FR-307）。
#   1. bundle ：決算短信（と決算説明資料）のPDFを取得し、原資料束を R2 の非公開バケットに保存する
#   2. draft  ：AG-12（Claude API）で、下書きと決算発表の行を作る
#   3. publish：data/auto の announcements に決算発表の行を加え、変更案を作り、AIの利用額を ops-log に追記する
# 取得できるのは、config/sources.yaml の ir と、企業マスタの ir_url・website_url のドメインだけ。
# 原資料束の本文は、リポジトリ、ログ、要約、成果物、変更案に出さない。
on:
  workflow_dispatch:
    inputs:
      company:
        description: 企業の slug（詳細掲載の企業）
        required: true
        type: string
      fiscal_period_end:
        description: 決算期（YYYY-MM。例：2027年3月期の第2四半期なら 2027-03）
        required: true
        type: string
      quarter:
        description: 四半期（1〜3。通期は 4）
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
      announced_on:
        description: 決算発表日（YYYY-MM-DD）
        required: true
        type: string
      tanshin_url:
        description: 決算短信のPDFのURL（https）
        required: true
        type: string
      presentation_url:
        description: 決算説明資料のPDFのURL（https。なければ空）
        required: false
        type: string
        default: ""

permissions:
  contents: read

# draft-company と同じグループにして、同時に動かさない（利用額の記録の書き込みがぶつからないように）
concurrency:
  group: draft-company
  cancel-in-progress: false

jobs:
  # 1. 原資料束を作る（bundle-write の Environment。R2 の書き込み用トークン）
  bundle:
    runs-on: ubuntu-24.04
    environment: bundle-write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 原資料束を作る（本文は出さない）
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SLUG: ${{ inputs.company }}
          PERIOD: ${{ inputs.fiscal_period_end }}
          QUARTER: ${{ inputs.quarter }}
          ANNOUNCED: ${{ inputs.announced_on }}
          TANSHIN: ${{ inputs.tanshin_url }}
          DECK: ${{ inputs.presentation_url }}
        run: |
          extra=()
          if [ -n "$DECK" ]; then extra=(--presentation-url "$DECK"); fi
          "$RUNNER_TEMP/venv/bin/python" scripts/bundle/make_ir_bundle.py \
            --company "$SLUG" --fiscal-period-end "$PERIOD" --quarter "$QUARTER" --announced-on "$ANNOUNCED" \
            --tanshin-url "$TANSHIN" "${extra[@]}" --summary "$GITHUB_STEP_SUMMARY"

  # 2. 下書きを作る（draft の Environment。R2 の読み取り用トークン、Claude API の ID連携）。リポジトリには書き込めない
  draft:
    needs: bundle
    runs-on: ubuntu-24.04
    environment: draft
    permissions:
      contents: read
      id-token: write   # Claude API の ID連携（Workload Identity Federation）に使う
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 運営記録（利用額）を読む
        run: |
          git clone --quiet --depth 1 --branch ops-log \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/ops-log" \
            || echo "ops-log ブランチがまだない"

      - name: GitHub の ID トークンを取る（Claude API の ID連携）
        run: |
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          test -s "$RUNNER_TEMP/gha-jwt"

      - name: 下書きを作る（原資料束の本文は出さない）
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
          SLUG: ${{ inputs.company }}
          PERIOD: ${{ inputs.fiscal_period_end }}
          QUARTER: ${{ inputs.quarter }}
        run: |
          set +e
          "$RUNNER_TEMP/venv/bin/python" scripts/draft/draft_ir.py \
            --company "$SLUG" --fiscal-period-end "$PERIOD" --quarter "$QUARTER" \
            --out-dir "$RUNNER_TEMP/draft-out" --ledger-dir "$RUNNER_TEMP/ops-log/ops/ledger" \
            --run-id "$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/gha-jwt"
          # 0：下書きを作った。3：休止中か予算の上限で、呼ばずに終えた（利用額の記録だけ残す）
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ir-draft-out
          path: ${{ runner.temp }}/draft-out
          retention-days: 3
          if-no-files-found: ignore

  # 3. 決算発表の行を加え、変更案を作り、利用額を ops-log に追記する。秘密は渡さない（GITHUB_TOKEN だけ）
  publish:
    needs: draft
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ir-draft-out
          path: ${{ runner.temp }}/draft-out

      - name: 下書きがあるか確かめる
        id: check
        env:
          SLUG: ${{ inputs.company }}
          PERIOD: ${{ inputs.fiscal_period_end }}
          QUARTER: ${{ inputs.quarter }}
        run: |
          out="$RUNNER_TEMP/draft-out"
          rel="content/ir-points/$SLUG/$PERIOD-q$QUARTER.md"
          if [ -f "$out/$rel" ] && [ -f "$out/announcement.json" ] && [ -f "$out/pr-body.md" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "rel=$rel" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "下書きがない。変更案は作らない"
          fi

      - name: 依存を入れる（版は scripts/requirements.txt で固定）
        if: steps.check.outputs.created == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements.txt

      - name: 下書きと決算発表の行を置いて、形式を検証する
        if: steps.check.outputs.created == 'true'
        env:
          SLUG: ${{ inputs.company }}
          REL: ${{ steps.check.outputs.rel }}
        run: |
          out="$RUNNER_TEMP/draft-out"
          mkdir -p "$(dirname "$REL")"
          cp "$out/$REL" "$REL"
          "$RUNNER_TEMP/venv/bin/python" scripts/edinet/add_announcement.py --company "$SLUG" --file "$out/announcement.json"
          "$RUNNER_TEMP/venv/bin/python" scripts/validate/validate_data.py

      - name: 変更案を作る
        if: steps.check.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.company }}
          PERIOD: ${{ inputs.fiscal_period_end }}
          QUARTER: ${{ inputs.quarter }}
          REL: ${{ steps.check.outputs.rel }}
        run: |
          branch="draft/ir-${SLUG}-${PERIOD}-q${QUARTER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$REL" "data/auto/$SLUG.json"
          git commit -m "下書き：${SLUG} の IR重要ポイント（${PERIOD} q${QUARTER}、AG-12、実行 ${GITHUB_RUN_ID}）"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "下書き：${SLUG} の IR重要ポイント（${PERIOD} q${QUARTER}）" \
            --body-file "$RUNNER_TEMP/draft-out/pr-body.md"

      # 利用額の記録（データ定義書 10.3）。JSON Lines は追記だけ。ブランチがなければ作る
      - name: 利用額を ops-log に追記する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/draft-out/ledger"
          if ! ls "$src"/*.jsonl >/dev/null 2>&1; then
            echo "利用額の記録がない"; exit 0
          fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/ops-log"
          if git ls-remote --exit-code --heads "$url" ops-log >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ops-log "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan ops-log
            git -C "$dir" remote add origin "$url"
          fi
          mkdir -p "$dir/ops/ledger"
          for f in "$src"/*.jsonl; do
            name="$(basename "$f")"
            if ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}\.jsonl$ ]]; then echo "記録のファイル名が正しくない"; exit 1; fi
            cat "$f" >> "$dir/ops/ledger/$name"
          done
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add ops/ledger
          git -C "$dir" commit --quiet -m "利用額の記録（draft-companies、実行 ${GITHUB_RUN_ID}）"
          git -C "$dir" push --quiet origin ops-log
